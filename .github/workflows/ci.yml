name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Testes
        run: pytest
      - name: Testes lentos (100 seeds por área)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: pytest -m slow
      - name: Cliente abre e desenha (sem tela)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m aethelgard --seed 1 --frames 120 --area plains
