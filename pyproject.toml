[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethelgard"
version = "0.1.0"
description = "Classless 2D isometric action RPG: your character grows in the proficiencies they use."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Peter" }]
dependencies = [
    "pygame-ce>=2.5,<3",   # window, drawing, input, sound (LGPL)
    "pygame_gui>=0.6.12",  # windows and widgets: skill trees, console (MIT)
    "numpy>=1.26",         # vectorized map generation (BSD)
    "tcod>=16",            # A*, distances and field of view in C (BSD)
    "pytmx>=3.32",         # hand-made maps from the Tiled editor (LGPL)
    "py7zr>=0.21",         # opens the .7z art packs downloaded on first run (LGPL)
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6"]
art = ["pillow>=10"]  # tools/fetch_art.py: 5× smaller palette PNGs (optional; HPND license)

[project.scripts]
aethelgard = "aethelgard.__main__:main"
aethelgard-art = "aethelgard.tools.fetch_art:main"

[project.urls]
Repository = "https://github.com/SEU_USUARIO/aethelgard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aethelgard = ["data/*.json", "data/maps/*.tmx", "data/maps/prefabs/*.tmx", "data/maps/*.tsx", "data/maps/*.png", "data/ui/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long tests (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
